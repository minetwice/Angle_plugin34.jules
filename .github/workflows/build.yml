name: Build Diablo SMP Plugin (Maven)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven' # Caching Maven dependencies for faster builds

    - name: Build with Maven
      run: mvn clean package

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v3
      with:
        name: DiabloSmpPlugin
        # We upload the generated jar. The regex skips the 'original-' jar generated by shade plugin.
        path: target/DiabloSmpPlugin-*.jar
