name: DiabloSmpPlugin
version: 1.1
main: com.diablo.smp.DiabloSmp
api-version: 1.21
commands:
  diablo:
    description: Main command for DiabloSmp
    usage: /diablo <subcommand>
  trust:
    description: Trust a player to trade ability books
    usage: /trust <player>
permissions:
  diablo.admin:
    description: Allows use of admin commands
    default: op
